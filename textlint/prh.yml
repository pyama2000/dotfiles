  # 訳書本文: 検索式 必要とせず の素の件数 4、同じ意味を確認した行 3 件 (L217・L1180・L1453)
  - expected: "必要とせず"
    pattern: "/(?<=[もは])要らず/"
    prh: "[L1-009] 層1: 訳書は「要る」を使わず「必要」と書く"
