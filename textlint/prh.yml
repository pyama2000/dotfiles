# AI コーディングエージェントの日本語を、人間の訳者の日本語に言い換える辞書 (層1・層2)。
# 採用した規則だけ。生成元は agent-skills の tests/scenarios/ai-to-translator-lexicon/data/rules.json で、
# measure_lexicon.py build-dict が書く。手で直さず rules.json を直して生成し直す。
# 各規則のコメント: ID と層、出所 (入力ファイルと行、または頻度差)、訳書本文の件数と根拠行。
# 本の組は 2 冊目 (FoSA)。出所はこの組の記録と頻度差、訳書本文はこの組の本文で、もう一方の本の根拠行の数を添える。
version: 1
rules:

  # L1-001 層1: 要る (連体・名詞の前) → 必要な
  # 出所: ja-merge-log-ch01-ch07.md L92#1・L98#1、ja-merge-log-ch21-ch27.md L17#3、頻度差 1 gram (`要る|こと`)
  # 訳書本文: 検索式 必要な の素の件数 146、同じ意味を確認した行 3 件 (L134・L2897・L4173)。1 冊目 (mts) の根拠行 3 件
  - expected: "必要な"
    pattern: "/要る(?=とき|ところ|場合|もの|こと|ため|ので|のは|のか|のに|ほど|だけ|[一-鿿ァ-ヺA-Za-z])/"
    prh: "[L1-001] 層1: 訳書は「要る」を使わず「必要」と書く"
    specs:
      - from: "設定が要るとき"
        to: "設定が必要なとき"
      - from: "要る資源"
        to: "必要な資源"
      - from: "要るなら"
        to: "要るなら"
      - from: "要る。"
        to: "要る。"
      - from: "設定が要るところを確認する"
        to: "設定が必要なところを確認する"

  # L1-002 層1: 要る (文末・区切りの前) → 必要になる
  # 出所: ja-merge-log-ch01-ch07.md L92#1・L98#1、ja-merge-log-ch21-ch27.md L17#3、頻度差 1 gram (`要る|こと`)
  # 訳書本文: 検索式 必要になる の素の件数 30、同じ意味を確認した行 3 件 (L3576・L4159・L6075)。1 冊目 (mts) の根拠行 3 件
  - expected: "必要になる"
    pattern: "/要る(?=[。、」）)|]|\\s|$)/"
    prh: "[L1-002] 層1: 訳書は「要る」を使わず「必要」と書く"
    specs:
      - from: "設定が要る。"
        to: "設定が必要になる。"
      - from: "設定が要る |"
        to: "設定が必要になる |"
      - from: "要るとき"
        to: "要るとき"

  # L1-003 層1: 要るなら → 必要な場合
  # 出所: ja-merge-log-ch01-ch07.md L92#1・L98#1、ja-merge-log-ch21-ch27.md L17#3、頻度差 1 gram (`要る|こと`)
  # 訳書本文: 検索式 必要な場合 の素の件数 15、同じ意味を確認した行 3 件 (L232・L3030・L4267)。1 冊目 (mts) の根拠行 3 件
  - expected: "必要な場合"
    pattern: "/要るなら/"
    prh: "[L1-003] 層1: 訳書は「要る」を使わず「必要」と書く"
    specs:
      - from: "設定が要るなら、"
        to: "設定が必要な場合、"
      - from: "要るとき"
        to: "要るとき"

  # L1-004 層1: 要るか → 必要か
  # 出所: ja-merge-log-ch01-ch07.md L92#1・L98#1、ja-merge-log-ch21-ch27.md L17#3、頻度差 1 gram (`要る|こと`)
  # 訳書本文: 検索式 必要か の素の件数 15、同じ意味を確認した行 3 件 (L1155・L3718・L5522)。1 冊目 (mts) の根拠行 3 件
  - expected: "必要か"
    pattern: "/要るか(?!ら)/"
    prh: "[L1-004] 層1: 訳書は「要る」を使わず「必要」と書く"
    specs:
      - from: "要るかで決める"
        to: "必要かで決める"
      - from: "要るから"
        to: "要るから"

  # L1-005 層1: 要る (接続: が・と・から・し。とき・ところ・とおりは除く) → 必要だ
  # 出所: ja-merge-log-ch01-ch07.md L92#1・L98#1、ja-merge-log-ch21-ch27.md L17#3、頻度差 1 gram (`要る|こと`)
  # 訳書本文: 検索式 必要だ(?!っ) の素の件数 18、同じ意味を確認した行 3 件 (L818・L1041・L6516)。1 冊目 (mts) の根拠行 3 件
  - expected: "必要だ"
    pattern: "/要る(?=が|と(?!き|ころ|おり)|から|し)/"
    prh: "[L1-005] 層1: 訳書は「要る」を使わず「必要」と書く"
    specs:
      - from: "要るが、"
        to: "必要だが、"
      - from: "要るから"
        to: "必要だから"
      - from: "要るとき"
        to: "要るとき"
      - from: "設定が要るところを確認する"
        to: "設定が要るところを確認する"
      - from: "要るとおり"
        to: "要るとおり"

  # L1-006 層1: 要り (連用) → 必要になり
  # 出所: ja-merge-log-ch01-ch07.md L92#1・L98#1、ja-merge-log-ch21-ch27.md L17#3、頻度差 1 gram (`要る|こと`)
  # 訳書本文: 検索式 必要になり の素の件数 2、同じ意味を確認した行 2 件 (L4981・L5423)。1 冊目 (mts) の根拠行 3 件
  - expected: "必要になり"
    pattern: "/要り(?=うる|得る|、|ま)/"
    prh: "[L1-006] 層1: 訳書は「要る」を使わず「必要」と書く"
    specs:
      - from: "要りうる"
        to: "必要になりうる"
      - from: "要ります"
        to: "必要になります"
      - from: "要る。"
        to: "要る。"

  # L1-007 層1: 要らない・要らなく → 必要ない・必要なく
  # 出所: ja-merge-log-ch01-ch07.md L92#1・L98#1、ja-merge-log-ch21-ch27.md L17#3、頻度差 1 gram (`要る|こと`)
  # 訳書本文: 検索式 必要な[いく] の素の件数 11、同じ意味を確認した行 3 件 (L174・L425・L1787)。1 冊目 (mts) の根拠行 3 件
  - expected: "必要な"
    pattern: "/要らな(?=[いく])/"
    prh: "[L1-007] 層1: 訳書は「要る」を使わず「必要」と書く"
    specs:
      - from: "要らない"
        to: "必要ない"
      - from: "要らなくなる"
        to: "必要なくなる"
      - from: "要る。"
        to: "要る。"

  # L1-009 層1: 「も」「は」の後の要らず → 必要とせず
  # 出所: ja-merge-log-ch01-ch07.md L92#1・L98#1、ja-merge-log-ch21-ch27.md L17#3、頻度差 1 gram (`要る|こと`)
  # 訳書本文: 検索式 必要とせず の素の件数 0、同じ意味を確認した行 0 件 (なし)。1 冊目 (mts) の根拠行 3 件
  - expected: "必要とせず"
    pattern: "/(?<=[もは])要らず/"
    prh: "[L1-009] 層1: 訳書は「要る」を使わず「必要」と書く"
    specs:
      - from: "注入も特別な処理も要らず、"
        to: "注入も特別な処理も必要とせず、"
      - from: "設定は要らずに使える"
        to: "設定は必要とせずに使える"
      - from: "追加費用が要らずに使える"
        to: "追加費用が要らずに使える"
      - from: "手間要らず"
        to: "手間要らず"
      - from: "要らない"
        to: "要らない"

  # L1-012 層1: 無い・無く・無し・無けれ → ない・なく・なし・なけれ
  # 出所: 頻度差 1 gram (`無い|状態|を`)
  # 訳書本文: 検索式 (?<!で)[がもは]な(?:い|く|し|けれ|かっ) の素の件数 158、同じ意味を確認した行 3 件 (L61・L1173・L2834)。1 冊目 (mts) の根拠行 3 件
  - expected: "な"
    pattern: "/(?<!台)無(?=い|く(?!な)|し|けれ|かっ|さ)/"
    prh: "[L1-012] 層1: 訳書は「無い」を使わず「ない」と書く"
    specs:
      - from: "根拠が無い"
        to: "根拠がない"
      - from: "無ければ"
        to: "なければ"
      - from: "無くす"
        to: "なくす"
      - from: "台無し"
        to: "台無し"
      - from: "無効"
        to: "無効"
      - from: "無視"
        to: "無視"
      - from: "制約が無くなる"
        to: "制約が無くなる"
      - from: "根拠が無くても"
        to: "根拠がなくても"

