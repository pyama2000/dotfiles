# AI コーディングエージェントの日本語を、人間の訳者の日本語に言い換える辞書 (層1・層2)。
# 採用した規則だけ。生成元は agent-skills の tests/scenarios/ai-to-translator-lexicon/data/rules.json で、
# measure_lexicon.py build-dict が書く。手で直さず rules.json を直して生成し直す。
# 各規則のコメント: ID と層、出所 (入力ファイルと行、または頻度差)、訳書本文の件数と根拠行。
version: 1
rules:

  # L1-001 層1: 要る (連体・名詞の前) → 必要な
  # 出所: ja-terms-diff.md L196・L234#2、ja-merge-log-details.md L29・L85・L140・L205・L328・L456・L566・L666・L839・L905・L975・L1035・L1221・L1324・L1425・L1566・L1673・L1803・L1822・L1874・L1918・L1919・L1934、頻度差 34 gram (`要る`・`が|要る|。`・`仕組み|が|要る|。` ほか)
  # 訳書本文: 検索式 必要な の素の件数 147、同じ意味を確認した行 3 件 (L65・L81・L90)
  - expected: "必要な"
    pattern: "/要る(?=とき|ところ|場合|もの|こと|ため|ので|のは|のか|のに|ほど|だけ|[一-鿿ァ-ヺA-Za-z])/"
    prh: "[L1-001] 層1: 訳書は「要る」を使わず「必要」と書く"
    specs:
      - from: "設定が要るとき"
        to: "設定が必要なとき"
      - from: "要る資源"
        to: "必要な資源"
      - from: "要るなら"
        to: "要るなら"
      - from: "要る。"
        to: "要る。"
      - from: "設定が要るところを確認する"
        to: "設定が必要なところを確認する"

  # L1-002 層1: 要る (文末・区切りの前) → 必要になる
  # 出所: ja-terms-diff.md L196・L234#2、ja-merge-log-details.md L29・L85・L140・L205・L328・L456・L566・L666・L839・L905・L975・L1035・L1221・L1324・L1425・L1566・L1673・L1803・L1822・L1874・L1918・L1919・L1934、頻度差 34 gram (`要る`・`が|要る|。`・`仕組み|が|要る|。` ほか)
  # 訳書本文: 検索式 必要になる の素の件数 32、同じ意味を確認した行 3 件 (L40・L249・L866)
  - expected: "必要になる"
    pattern: "/要る(?=[。、」）)|]|\\s|$)/"
    prh: "[L1-002] 層1: 訳書は「要る」を使わず「必要」と書く"
    specs:
      - from: "設定が要る。"
        to: "設定が必要になる。"
      - from: "設定が要る |"
        to: "設定が必要になる |"
      - from: "要るとき"
        to: "要るとき"

  # L1-003 層1: 要るなら → 必要な場合
  # 出所: ja-terms-diff.md L196・L234#2、ja-merge-log-details.md L29・L85・L140・L205・L328・L456・L566・L666・L839・L905・L975・L1035・L1221・L1324・L1425・L1566・L1673・L1803・L1822・L1874・L1918・L1919・L1934、頻度差 34 gram (`要る`・`が|要る|。`・`仕組み|が|要る|。` ほか)
  # 訳書本文: 検索式 必要な場合 の素の件数 5、同じ意味を確認した行 3 件 (L194・L1048・L3617)
  - expected: "必要な場合"
    pattern: "/要るなら/"
    prh: "[L1-003] 層1: 訳書は「要る」を使わず「必要」と書く"
    specs:
      - from: "設定が要るなら、"
        to: "設定が必要な場合、"
      - from: "要るとき"
        to: "要るとき"

  # L1-004 層1: 要るか → 必要か
  # 出所: ja-terms-diff.md L196・L234#2、ja-merge-log-details.md L29・L85・L140・L205・L328・L456・L566・L666・L839・L905・L975・L1035・L1221・L1324・L1425・L1566・L1673・L1803・L1822・L1874・L1918・L1919・L1934、頻度差 34 gram (`要る`・`が|要る|。`・`仕組み|が|要る|。` ほか)
  # 訳書本文: 検索式 必要か の素の件数 12、同じ意味を確認した行 3 件 (L221・L796・L1292)
  - expected: "必要か"
    pattern: "/要るか(?!ら)/"
    prh: "[L1-004] 層1: 訳書は「要る」を使わず「必要」と書く"
    specs:
      - from: "要るかで決める"
        to: "必要かで決める"
      - from: "要るから"
        to: "要るから"

  # L1-005 層1: 要る (接続: が・と・から・し。とき・ところ・とおりは除く) → 必要だ
  # 出所: ja-terms-diff.md L196・L234#2、ja-merge-log-details.md L29・L85・L140・L205・L328・L456・L566・L666・L839・L905・L975・L1035・L1221・L1324・L1425・L1566・L1673・L1803・L1822・L1874・L1918・L1919・L1934、頻度差 34 gram (`要る`・`が|要る|。`・`仕組み|が|要る|。` ほか)
  # 訳書本文: 検索式 必要だ(?!っ) の素の件数 3、同じ意味を確認した行 3 件 (L1127・L2307・L5275)
  - expected: "必要だ"
    pattern: "/要る(?=が|と(?!き|ころ|おり)|から|し)/"
    prh: "[L1-005] 層1: 訳書は「要る」を使わず「必要」と書く"
    specs:
      - from: "要るが、"
        to: "必要だが、"
      - from: "要るから"
        to: "必要だから"
      - from: "要るとき"
        to: "要るとき"
      - from: "設定が要るところを確認する"
        to: "設定が要るところを確認する"
      - from: "要るとおり"
        to: "要るとおり"

  # L1-006 層1: 要り (連用) → 必要になり
  # 出所: ja-terms-diff.md L196・L234#2、ja-merge-log-details.md L29・L85・L140・L205・L328・L456・L566・L666・L839・L905・L975・L1035・L1221・L1324・L1425・L1566・L1673・L1803・L1822・L1874・L1918・L1919・L1934、頻度差 34 gram (`要る`・`が|要る|。`・`仕組み|が|要る|。` ほか)
  # 訳書本文: 検索式 必要になり の素の件数 24、同じ意味を確認した行 3 件 (L322・L524・L768)
  - expected: "必要になり"
    pattern: "/要り(?=うる|得る|、|ま)/"
    prh: "[L1-006] 層1: 訳書は「要る」を使わず「必要」と書く"
    specs:
      - from: "要りうる"
        to: "必要になりうる"
      - from: "要ります"
        to: "必要になります"
      - from: "要る。"
        to: "要る。"

  # L1-007 層1: 要らない・要らなく → 必要ない・必要なく
  # 出所: ja-terms-diff.md L196・L234#2、ja-merge-log-details.md L29・L85・L140・L205・L328・L456・L566・L666・L839・L905・L975・L1035・L1221・L1324・L1425・L1566・L1673・L1803・L1822・L1874・L1918・L1919・L1934、頻度差 34 gram (`要る`・`が|要る|。`・`仕組み|が|要る|。` ほか)
  # 訳書本文: 検索式 必要な[いく] の素の件数 3、同じ意味を確認した行 3 件 (L1437・L2669・L4999)
  - expected: "必要な"
    pattern: "/要らな(?=[いく])/"
    prh: "[L1-007] 層1: 訳書は「要る」を使わず「必要」と書く"
    specs:
      - from: "要らない"
